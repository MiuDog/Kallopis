name: kallopis
description: "Kallopis — the shared Flutter visual layer for the -ist product family."
version: 0.8.0

# 刻意不發布到 pub.dev。消費者是同一台機器上的 -ist 產品，以 path dependency
# 引入即可（見 README「安裝與依賴」）；發版只會在改動與生效之間多插一道手續。
publish_to: 'none'
repository: https://github.com/MiuDog/Kallopis

environment:
  sdk: ^3.12.2
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  crypto: ^3.0.7

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/OFL-IBM-Plex.txt
    - assets/fonts/LICENSE-FLATICON-UICONS.txt

  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    - family: IBM Plex Sans TC
      fonts:
        - asset: assets/fonts/IBMPlexSansTC-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansTC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansTC-Bold.ttf
          weight: 700
    - family: Flaticon UIcons Regular Rounded
      fonts:
        - asset: assets/fonts/FlaticonUIcons-RegularRounded.ttf
          weight: 400
