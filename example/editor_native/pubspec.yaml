name: kallopis_editor_native
description: Optional Windows catalog entry backed by the local Krepis DLL.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  kallopis:
    path: ../..
  kallopis_catalog:
    path: ..
  krepis_kallopis: any
  win32: ^6.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
