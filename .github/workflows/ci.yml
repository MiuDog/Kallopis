# Kallopis CI
#
# 對每一次 push 到 main 與每一個 pull request 強制執行機械閘門（見 README.md「## 閘門」）。
# 在此之前這些閘門只在本機跑，多個 agent 併發編輯時漏跑會直接漏進 main
# ——這個 workflow 的作用就是讓漏跑不再可能。
#
# golden 測試對字型渲染敏感：同一份 .png 在不同作業系統上會因字型光柵化差異而
# 假失敗。repo 裡的 golden 全部產生於 Windows，因此**跑測試的 job 必須是 windows**。
# 格式、分析與清單新鮮度不碰渲染，放在較快的 ubuntu 上。
name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

# 同一分支的新 push 取消還在跑的舊 run，省 runner 時間。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 與 AGENTS.md「環境事實」一致：Flutter 3.44.4 stable、Dart 3.12.2。
  # 明確釘死版本，不用會浮動的 stable "latest"，避免上游版本更新在無預警下打壞 CI。
  FLUTTER_VERSION: '3.44.4'
  FLUTTER_CHANNEL: 'stable'

jobs:
  root:
    name: root package
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Flutter（含 pub cache）
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: 取得相依套件
        run: flutter pub get

      - name: 格式檢查（dart format）
        run: dart format --output=none --set-exit-if-changed .

      - name: 靜態分析（flutter analyze）
        run: flutter analyze --fatal-infos

      - name: 元件清單新鮮度（inventory --check）
        run: dart run tool/inventory.dart --check

  test:
    name: tests (golden 基準平台)
    # 不能改成 ubuntu：golden 產生於 Windows，換平台會整批假失敗。
    # 真要移到 ubuntu，必須在同一次提交裡於 Linux 重新產生全部 golden。
    runs-on: windows-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Flutter（含 pub cache）
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: 取得相依套件（root）
        run: flutter pub get

      - name: 執行測試（root，含 golden）
        run: flutter test

      - name: 取得相依套件（example）
        working-directory: example
        run: flutter pub get

      - name: 執行測試（example，含 style_switch_golden_test）
        working-directory: example
        run: flutter test

  example:
    name: example package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Flutter（含 pub cache）
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: 取得相依套件
        run: flutter pub get

      - name: 格式檢查（dart format）
        run: dart format --output=none --set-exit-if-changed .

      - name: 靜態分析（flutter analyze）
        run: flutter analyze --fatal-infos

  release:
    name: GitHub Release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs:
      - root
      - test
      - example
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 核對發布版本
        shell: bash
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          grep -Fq "## ${version} —" CHANGELOG.md

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
          --title "Kallopis ${GITHUB_REF_NAME}"
